<div class="modal-header">
  <h5 class="modal-title">
    Cheque {{ doc.original_check.check_number }}
    <small class="text-muted">· {{ doc.file_name|default:"archivo" }}</small>
  </h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body text-center">
  {% if doc.ext == 'pdf' %}
    {# Los PDF necesitan un visor, no un <img>. #}
    <iframe src="{{ doc.file_path.url }}" title="Cheque {{ doc.original_check.check_number }}"
            style="width:100%; height:75vh; border:0;"></iframe>
  {% else %}
    <img src="{{ doc.file_path.url }}" class="img-fluid"
         alt="Cheque {{ doc.original_check.check_number }}" style="max-height:75vh;">
  {% endif %}
</div>
<div class="modal-footer">
  <a href="{{ doc.file_path.url }}" target="_blank" rel="noopener" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-box-arrow-up-right"></i> Abrir en pestaña nueva
  </a>
  <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
</div>
