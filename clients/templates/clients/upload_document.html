{% extends 'accounts/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<body>
    <nav aria-label="breadcrumb" style="--bs-breadcrumb-divider: '>';">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'clients-list'%}">Clientes</a></li>
            <li class="breadcrumb-item"><a href="{% url 'view_client' client.id 'documents' %}">{{client}}</a></li>
            <li class="breadcrumb-item active">Agregar documento</li>
        </ol>
    </nav>
    <div class="container bg-light shadow-md p-5 form-layout">
        <h3>Agregar documento</h3>
        <p><mark>{{client}}</mark></p>
        <hr>
        <br>
        <form method="post" action="{% url 'upload_document' client.id %}" onsubmit="showLoading()" enctype="multipart/form-data">
            {% csrf_token %}
            {{ document_form|crispy }}
            <div class="col text-end"> 
            <a class="btn btn-outline-danger"  href="{% url 'view_client' client.id 'documents' %}"> Cancelar </a>
            <button type="submit" class="btn btn-primary">
                <span>Agregar documento</span>
                <span class="loading-indicator" style="display: none;">Subiendo...</span>
            </button>
            </div>
        </form>
    </div>
</body>
<script>
    function showLoading() {
        document.querySelector('button[type="submit"] > span:first-child').style.display = 'none';
        document.querySelector('.loading-indicator').style.display = 'inline-block';
        document.querySelector('button[type="submit"]').disabled = true;
    }

    this.setAttribute(
        "data-date",
        moment(this.value, "YYYY-MM-DD")
            .format( this.getAttribute("data-date-format") )
    )
}).trigger("change")*/

  </script>
{% endblock %}
